name: Publish image

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04-arm # natif ARM64, pas de QEMU
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          # VPS Oracle Ampere = arm64.
          platforms: linux/arm64
          push: true
          tags: ghcr.io/guillaumejacquart/guillaumejacquart.com:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

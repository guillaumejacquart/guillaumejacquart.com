<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
	<!-- Minimal GJ badge — Software Engineer / Builder / Curious mind -->
	<!-- Rounded frame = builder / structure, GJ = personal, dot = curiosity spark -->
	<rect x="2.5" y="2.5" width="27" height="27" rx="7" stroke-width="2.2"/>
	<text x="16" y="17.2" text-anchor="middle" dominant-baseline="middle" font-family="Rubik, Public Sans, sans-serif" font-size="12" font-weight="600" letter-spacing="-0.4">GJ</text>
	<circle cx="23.8" cy="7.2" r="1.7"/>
	<style>
		rect { stroke: #111827; }
		text { fill: #111827; }
		circle { fill: #6b7280; }
		@media (prefers-color-scheme: dark) {
			rect { stroke: #f9fafb; }
			text { fill: #f9fafb; }
			circle { fill: #9ca3af; }
		}
	</style>
</svg>

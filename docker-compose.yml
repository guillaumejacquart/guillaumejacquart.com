services:
  guillaumejacquart-com:
    image: ghcr.io/guillaumejacquart/guillaumejacquart.com:latest
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.guillaumejacquart-com.rule=Host(`guillaumejacquart.com`) || Host(`www.guillaumejacquart.com`)"
      - "traefik.http.routers.guillaumejacquart-com.entrypoints=websecure"
      - "traefik.http.routers.guillaumejacquart-com.tls=true"
      - "traefik.http.routers.guillaumejacquart-com.tls.certresolver=myresolver"
      - "traefik.http.services.guillaumejacquart-com.loadbalancer.server.port=80"
      - "homepage.group=Side Projects"
      - "homepage.name=guillaumejacquart.com"
      - "homepage.href=https://guillaumejacquart.com"
      - "homepage.icon=sh-user"
      - "homepage.description=Personal website"
